<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CreativeFlow OSS</title><style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:#101722;color:#e8eef6}main{max-width:1200px;margin:auto;padding:32px 20px}h1{font-size:36px;margin:0}p{color:#a7b7cb}form,.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}input,select,button,textarea{background:#202c3e;border:1px solid #44536a;color:#e8eef6;border-radius:8px;padding:10px;font:inherit}button{cursor:pointer;background:#365eaa}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #93baff}.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.column{background:#182334;border:1px solid #2c3b50;padding:12px;border-radius:12px;min-height:200px}.column h2{font-size:14px;text-transform:uppercase;color:#b6c7df}.item{padding:12px;background:#27354a;border-radius:8px;margin:10px 0;overflow-wrap:anywhere}.item select{width:100%;margin-top:8px}.item p{font-size:13px}.notice{min-height:20px}label{display:grid;gap:4px} @media(max-width:800px){.board{grid-template-columns:repeat(2,1fr)}}@media(max-width:450px){.board{grid-template-columns:1fr}}
</style><main><header><h1>CreativeFlow OSS</h1><p>Local-first creative production board · No account required · Demo data only</p></header><form id="new"><label>Title<input name="title" required maxlength="160"></label><label>Project<input name="project" required maxlength="100"></label><label>Channel<select name="channel" id="channel"></select></label><label>Brief<input name="brief" maxlength="500"></label><button>Add item</button></form><div class="toolbar"><button id="csv">Export CSV</button><button id="json">Export JSON</button><label>Import JSON<input id="import" type="file" accept="application/json,.json"></label></div><p role="status" id="notice" class="notice"></p><section class="board" id="board" aria-label="Production board"></section></main><script type="module" src="src/app.js"></script></html>
